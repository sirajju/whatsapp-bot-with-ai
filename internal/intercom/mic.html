<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0b0e">
  <title>Voice to Sirajju</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0e;
      --fg: #f5f5f7;
      --muted: #8e8e93;
      --accent: #ff3b30;
      --accent-glow: rgba(255, 59, 48, 0.45);
      --recording: #ff453a;
      --cancelling: #8e8e93;
      --ok: #30d158;
      --card-bg: #1c1c1e;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--fg);
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    .wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 24px 20px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header .back {
      background: #242428;
      color: var(--fg);
      border: 0;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    header .back:active { opacity: 0.7; }
    header h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
    }
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
    }
    .status-badge {
      font-size: 15px;
      font-weight: 500;
      color: var(--muted);
      min-height: 24px;
      transition: color 0.2s ease;
      max-width: 320px;
      line-height: 1.4;
    }
    .status-badge.recording { color: #ff453a; }
    .status-badge.cancelling { color: #ffd60a; font-weight: 600; }
    .status-badge.sent { color: var(--ok); font-weight: 600; }
    .status-badge.err { color: #ff453a; }

    .timer {
      font-size: 42px;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      letter-spacing: -0.5px;
      min-height: 52px;
      color: var(--fg);
      transition: opacity 0.2s;
    }

    .mic-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0;
    }

    .mic-btn {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px var(--accent-glow);
      cursor: pointer;
      touch-action: none;
      position: relative;
      z-index: 2;
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .mic-btn.active {
      transform: scale(1.1);
      background: var(--recording);
      box-shadow: 0 12px 50px rgba(255, 69, 58, 0.6);
      animation: pulse-ring 1.3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .mic-btn.cancelling {
      transform: scale(0.95);
      background: var(--cancelling);
      box-shadow: 0 8px 30px rgba(142, 142, 147, 0.4);
      animation: none;
    }

    .mic-btn.sent {
      background: var(--ok);
      box-shadow: 0 10px 40px rgba(48, 209, 88, 0.5);
      transform: scale(1.05);
      animation: none;
    }

    @keyframes pulse-ring {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 69, 58, 0.7);
      }
      70% {
        box-shadow: 0 0 0 28px rgba(255, 69, 58, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255, 69, 58, 0);
      }
    }

    .hint {
      color: #636366;
      font-size: 13px;
      text-align: center;
      max-width: 280px;
      line-height: 1.4;
    }

    .err-box {
      background: rgba(255, 69, 58, 0.12);
      border: 1px solid rgba(255, 69, 58, 0.3);
      border-radius: 12px;
      padding: 12px 16px;
      color: #ff6961;
      font-size: 14px;
      max-width: 320px;
      line-height: 1.4;
    }

    footer {
      text-align: center;
      padding: 8px 0;
      color: #48484a;
      font-size: 12px;
    }
  </style>
</head>
<body oncontextmenu="return false;">
  <div class="wrap">
    <header>
      <button class="back" onclick="history.back()">← Back</button>
      <h1>Voice to Sirajju</h1>
      <span style="width: 56px"></span>
    </header>

    <div class="stage">
      <div class="status-badge" id="status">Hold button to speak</div>
      <div class="timer" id="timer">0:00</div>

      <div class="mic-container">
        <button class="mic-btn" id="micBtn" aria-label="Hold to record">🎙️</button>
      </div>

      <div class="hint" id="hint">Press &amp; hold to talk • Drag away to cancel • Release to send</div>
      <div class="err-box" id="errBox" style="display: none;"></div>
    </div>

    <footer>Wall Phone Intercom</footer>
  </div>

<script>
// Determine correct endpoint based on current origin
const WABOT_URL = window.location.port === '8766'
  ? '/voice-from-home'
  : 'https://sirajju.tail7dc29c.ts.net:8766/voice-from-home';

const MAX_SECONDS = 60;
const $ = id => document.getElementById(id);
const micBtn = $('micBtn'), status = $('status'), timer = $('timer'),
      hint = $('hint'), errBox = $('errBox');

let mediaStream = null, rec = null, chunks = [];
let isRecording = false, isCancelled = false, isSending = false;
let startTime = 0, timerInterval = null;
let startX = 0, startY = 0;
let pointerId = null;

const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

function pickMime() {
  const prefs = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/ogg;codecs=opus',
    'audio/ogg',
    'audio/mp4'
  ];
  for (const m of prefs) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}

function showErr(msg) {
  errBox.textContent = msg;
  errBox.style.display = 'block';
  status.textContent = 'Error';
  status.className = 'status-badge err';
}

function clearErr() {
  errBox.textContent = '';
  errBox.style.display = 'none';
}

async function startRecording(e) {
  if (isRecording || isSending) return;
  clearErr();

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showErr('Microphone API not available in this browser.');
    return;
  }

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    const mime = pickMime();
    rec = new MediaRecorder(mediaStream, mime ? { mimeType: mime } : {});
    chunks = [];

    rec.ondataavailable = evt => {
      if (evt.data && evt.data.size > 0) chunks.push(evt.data);
    };

    rec.onstop = () => {
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }

      if (isCancelled) {
        resetToIdle('Cancelled ✕', 'status-badge cancelling');
        return;
      }

      const duration = Date.now() - startTime;
      if (duration < 600) {
        resetToIdle('Hold button while speaking (too short)', 'status-badge');
        return;
      }

      // Valid recording -> send immediately!
      const mimeType = rec ? (rec.mimeType || 'audio/webm') : 'audio/webm';
      const blob = new Blob(chunks, { type: mimeType });
      sendVoice(blob);
    };

    rec.start();
    isRecording = true;
    isCancelled = false;
    startTime = Date.now();

    // Haptic feedback on start
    if (navigator.vibrate) navigator.vibrate(40);

    micBtn.classList.add('active');
    micBtn.classList.remove('cancelling', 'sent');
    status.textContent = 'Recording… Release to send';
    status.className = 'status-badge recording';
    hint.textContent = 'Drag finger away to cancel';

    timerInterval = setInterval(() => {
      const s = Math.floor((Date.now() - startTime) / 1000);
      timer.textContent = fmt(s);
      if (s >= MAX_SECONDS) {
        stopRecording();
      }
    }, 200);

  } catch (err) {
    console.error('mic error:', err);
    showErr('Mic permission denied or unavailable: ' + (err.message || err.name));
    resetToIdle();
  }
}

function stopRecording() {
  if (!isRecording) return;
  isRecording = false;

  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  micBtn.classList.remove('active', 'cancelling');

  if (rec && rec.state === 'recording') {
    rec.stop();
  }
}

async function sendVoice(blob) {
  isSending = true;
  status.textContent = 'Sending to Sirajju… ⏳';
  status.className = 'status-badge recording';
  hint.textContent = 'Uploading voice note…';
  micBtn.style.opacity = '0.5';

  try {
    const res = await fetch(WABOT_URL, {
      method: 'POST',
      headers: { 'Content-Type': blob.type || 'audio/webm' },
      body: blob
    });

    if (!res.ok) {
      const txt = await res.text().catch(() => '');
      throw new Error(`HTTP ${res.status}${txt ? ': ' + txt : ''}`);
    }

    // Success!
    status.textContent = '✓ Sent!';
    status.className = 'status-badge sent';
    micBtn.classList.add('sent');
    micBtn.textContent = '✓';
    micBtn.style.opacity = '1';

    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);

    setTimeout(() => {
      history.back();
    }, 700);

  } catch (err) {
    console.error('send failed:', err);
    showErr('Send failed: ' + (err.message || err));
    resetToIdle('Failed to send', 'status-badge err');
  } finally {
    isSending = false;
  }
}

function resetToIdle(customMsg, customClass) {
  isRecording = false;
  isCancelled = false;
  isSending = false;
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }

  micBtn.classList.remove('active', 'cancelling', 'sent');
  micBtn.textContent = '🎙️';
  micBtn.style.opacity = '1';

  if (customMsg) {
    status.textContent = customMsg;
    status.className = customClass || 'status-badge';
    setTimeout(() => {
      if (!isRecording && !isSending) {
        status.textContent = 'Hold button to speak';
        status.className = 'status-badge';
        timer.textContent = '0:00';
        hint.textContent = 'Press & hold to talk • Drag away to cancel • Release to send';
      }
    }, 1500);
  } else {
    status.textContent = 'Hold button to speak';
    status.className = 'status-badge';
    timer.textContent = '0:00';
    hint.textContent = 'Press & hold to talk • Drag away to cancel • Release to send';
  }
}

// Pointer Events for robust touch and desktop support
micBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (isSending) return;
  pointerId = e.pointerId;
  startX = e.clientX;
  startY = e.clientY;
  try { micBtn.setPointerCapture(pointerId); } catch (_) {}
  startRecording(e);
});

micBtn.addEventListener('pointermove', e => {
  if (!isRecording) return;
  const dist = Math.hypot(e.clientX - startX, e.clientY - startY);
  if (dist > 75) {
    if (!isCancelled) {
      isCancelled = true;
      micBtn.classList.add('cancelling');
      status.textContent = 'Release to cancel ✕';
      status.className = 'status-badge cancelling';
      hint.textContent = 'Drag back to resume recording';
      if (navigator.vibrate) navigator.vibrate(20);
    }
  } else {
    if (isCancelled) {
      isCancelled = false;
      micBtn.classList.remove('cancelling');
      status.textContent = 'Recording… Release to send';
      status.className = 'status-badge recording';
      hint.textContent = 'Drag finger away to cancel';
    }
  }
});

micBtn.addEventListener('pointerup', e => {
  e.preventDefault();
  if (pointerId !== null) {
    try { micBtn.releasePointerCapture(pointerId); } catch (_) {}
    pointerId = null;
  }
  stopRecording();
});

micBtn.addEventListener('pointercancel', e => {
  e.preventDefault();
  if (pointerId !== null) {
    try { micBtn.releasePointerCapture(pointerId); } catch (_) {}
    pointerId = null;
  }
  isCancelled = true;
  stopRecording();
});
</script>
</body>
</html>
